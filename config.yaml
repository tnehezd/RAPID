# config.yaml

# Consolidated parameters for the main simulation program (main.c)
# These directly map to the 'options_t' structure used for parsing.
simulation_parameters:
  # Simulation Control Options (now with boolean flags for clarity)
  enable_dust_drift: true            # Corresponds to 'drift' in C (1.0 for true, 0.0 for false)
  enable_dust_growth: true           # Corresponds to 'growth' in C
  enable_gas_evolution: true        # Corresponds to 'evol' in C
  enable_two_dust_populations: true # Corresponds to 'twopop' in C
  fragmentation_velocity: 500.0     # Corresponds to 'ufrag' in C
  fragmentation_factor: 0.37         # Corresponds to 'ffrag' in C
  number_of_dust_particles: 2000  
 
disk_parameters:
  # Grid and Disk Initial Parameters (used if no input_file is provided)
  number_of_grid_points: 500    # Corresponds to 'ngrid_val' (-n)
  inner_radius_au: 1.0           # Corresponds to 'rmin_val' (-ri)
  outer_radius_au: 50.0           # Corresponds to 'rmax_val' (-ro)
  initial_gas_sigma0_msun_per_au2: 3.33e-05  # Corresponds to 'sigma0_val' (-sigma0_init)
  sigma_profile_exponent: -0.5    # Corresponds to 'sigmap_exp_val' (-index_init)
  alpha_viscosity: 0.01          # Corresponds to 'alpha_visc_val' (-alpha_init)
  star_mass_msun: 1.0            # Corresponds to 'star_val' (-m0_init)
  aspect_ratio_at_1au: 0.05      # Corresponds to 'hasp_val' (-h_init)
  flaring_index: 0.0             # Corresponds to 'flind_val' (-flind_init)
  density_floor: 1e-12  
  # PHOTOEVAPORATION SELECTION
  # Options: "Owen", "Picogna"
  photoevaporation_mode: "none"
  xray_luminosity_erg_s: 1.0e30
  # INITIAL CONDITION PROFILE SELECTOR
  # Set to True to enable Anna's self-similar profile with exponential taper
  # Set to False to use the standard pure power-law profile
  use_cutoff_for_gas: false
  characteristic_cutoff_radius_au: 100.0   # Corresponds to '-rcutoff'
  cutoff_sharpness_factor: 2.0           # Corresponds to '-ncutoff' (typically 2.0 - gamma)

boundary_conditions:
  inner_boundary_condition: "absorbing"     # Options: "zero_gradient", "parabolic", "fixed_flux", "absorbing", "reflecting", "linear_extrapolation"
  outer_boundary_condition: "parabolic"


deadzone_parameters:
  # Dead Zone Parameters
  deadzone_inner_radius_au: 2.7      # Corresponds to 'r_dze_i_val' (-rdzei)
  deadzone_outer_radius_au: 24.0      # Corresponds to 'r_dze_o_val' (-rdzeo)
  deadzone_inner_transition_width_mult: 0.5 # Corresponds to 'dr_dze_i_val' (-drdzei)
  deadzone_outer_transition_width_mult: 0.5 # Corresponds to 'dr_dze_o_val' (-drdzeo)
  deadzone_alpha_reduction: 0.01    # Corresponds to 'a_mod_val' (-amod)

dust_parameters:
  # Dust Initialization Parameters (if initial profile is generated)
  initial_dust_to_gas_ratio: 0.01    # Corresponds to 'eps_val' (-eps)
  population_one_mass_ratio: 0.85    # Corresponds to 'ratio_val' (-ratio)
  micro_particle_size_cm: 0.0001     # Corresponds to 'mic_val' (-mic)
  one_size_particle_value_cm: 1.0    # Corresponds to 'onesize_val' (-onesize)
  dust_particle_density_g_cm3: 1.6  # NEW: Por szemcse sűrűsége (g/cm^3)
  disk_mass_dust: 0.01
  dust_smoothing_mode: "gaussian"
  gaussian_smoothing_sigma_grid_units: 1.0    # Width of the Gaussian kernel in grid-cell units (Δr). 1.0 means the smoothing spreads over roughly one cell.
  gaussian_smoothing_cutoff_sigma: 3.0        # Kernel cutoff expressed in multiples of sigma. 3.0 means contributions beyond 3σ (≈ 3 grid cells) are ignored.

output_parameters:
  # File I/O Parameters
  input_file_path: ""                # Path to the input profile file (e.g., "init_data.dat"), leave empty "" for generation (-i)
  output_directory_name: "output"    # Output directory name (-o)
  output_format: "ascii"               # Format of the outputfile (can set to hdf5)

time_parameters:
  # Time Parameters
  fixed_time_step: 0.0              # Corresponds to 'tStep' (-tStep) --- let's set it to 0, as the code itself calculates adaptive timestep...
  total_simulation_time: 1e3       # Corresponds to 'totalTime' (-tmax)
  output_write_frequency: 5     # Corresponds to 'outputFrequency' (-outfreq)

log_parameters:
  info_level: "debug" # "none", "info", vagy "debug"