# config.yaml - Viscosity Test for Ring Evolution

simulation_parameters:
  enable_gas_evolution: true
  test_mode: "ring_viscosity"            

disk_parameters:
  number_of_grid_points: 200
  inner_radius_au: 0.5
  outer_radius_au: 25.0
  disk_mass: 0.01                   
  alpha_viscosity: 0.3
  star_mass_msun: 1.0

boundary_conditions:
  inner_boundary_condition: "parabolic" 
  outer_boundary_condition: "reflecting" 

output_parameters:
  output_directory_name: "notebooks/ring_viscosity_test/ring_viscosity_test"   

time_parameters:    
  total_simulation_time: 100000.0    
  output_write_frequency: 20000.0

log_parameters:
  info_level: "info"  
  disable_terminal_panels: true   
