# config.yaml - Long-Term Mass Conservation Benchmark

simulation_parameters:
  enable_gas_evolution: true
  test_mode: "mass_test"             

disk_parameters:
  number_of_grid_points: 500
  inner_radius_au: 1.0
  outer_radius_au: 50.0
  disk_mass: 0.01                    
  sigma_profile_exponent: 0.5
  alpha_viscosity: 0.01
  star_mass_msun: 1.0
  aspect_ratio_at_1au: 0.05
  flaring_index: 0.5

boundary_conditions:
  inner_boundary_condition: "fixed_flux" 
  outer_boundary_condition: "fixed_flux"

output_parameters:
  output_directory_name: "notebooks/mass_conservation_test_outputs/output_mass_test_fixed_flux"

time_parameters:               
  total_simulation_time: 100000.0    
  output_write_frequency: 20000.0

log_parameters:
  info_level: "info"  
  disable_terminal_panels: true