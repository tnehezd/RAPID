# config.yaml - Viscosity Test for Ring Evolution

simulation_parameters:
  enable_gas_evolution: true
  test_mode: "ring_viscosity"            

disk_parameters:
  number_of_grid_points: 4096
  inner_radius_au: 1.0
  outer_radius_au: 50.0
  disk_mass: 0.01                   
  alpha_viscosity: 0.01
  star_mass_msun: 1.0

boundary_conditions:
  inner_boundary_condition: "parabolic" 
  outer_boundary_condition: "reflecting" 

output_parameters:
  output_directory_name: "notebooks/convergence_test/convergence_4096"   

time_parameters:    
  total_simulation_time: 1
  output_write_frequency: 1

log_parameters:
  info_level: "info"  
  disable_terminal_panels: true   
