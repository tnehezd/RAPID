simulation_parameters:
  enable_dust_drift: true
  enable_dust_growth: true
  enable_gas_evolution: true
  enable_two_dust_populations: true
  fragmentation_velocity: 500.0
  fragmentation_factor: 0.37
  number_of_dust_particles: 1000

disk_parameters:
  number_of_grid_points: 500
  inner_radius_au: 1.0
  outer_radius_au: 50.0
  disk_mass: 0.01
  sigma_profile_exponent: -0.5
  alpha_viscosity: 0.01
  aspect_ratio_at_1au: 0.05
  density_floor: 1e-12
  dust_density_floor: 1e-14


boundary_conditions:
  inner_boundary_condition: "zero_gradient"
  outer_boundary_condition: "parabolic"

deadzone_parameters:
  deadzone_inner_radius_au: 2.7
  deadzone_outer_radius_au: 24.0
  deadzone_inner_transition_width: 1.5
  deadzone_outer_transition_width: 1.5
  deadzone_alpha_reduction: 0.01

dust_parameters:
  initial_dust_to_gas_ratio: 0.01
  population_one_mass_ratio: 0.85
  micro_particle_size_cm: 0.0001
  large_size_particle_value_cm: 1.0
  dust_particle_density_g_cm3: 1.6
  disk_mass_dust: 0.01
  dust_smoothing_mode: "gaussian"
  gaussian_smoothing_sigma_grid_units: 1.0
  gaussian_smoothing_cutoff_sigma: 3.0

output_parameters:
  output_directory_name: "output_dust"
  output_format: "ascii"

time_parameters:
  fixed_time_step: 0.0
  total_simulation_time: 5e5
  output_write_frequency: 1000

log_parameters:
  info_level: "none"