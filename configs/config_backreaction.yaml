# Experimental stationary, vertically averaged mutual drag; start without growth.
simulation_parameters:
  enable_gas_evolution: true
  enable_dust_drift: true
  enable_dust_growth: false
  enable_two_dust_populations: false
  enable_backreaction: true
  enable_selfgravity: false
  enable_photoevaporation: false
  number_of_dust_particles: 256
  omp_num_threads: 4

disk_parameters:
  number_of_grid_points: 128
  radial_grid_type: logarithmic
  inner_radius_au: 1.0
  outer_radius_au: 50.0
  disk_mass: 0.01
  sigma_profile_exponent: -0.5
  alpha_viscosity: 0.003
  aspect_ratio_at_1au: 0.05
  flaring_index: 0.0
  star_mass_msun: 1.0
  density_floor: 1.0e-20
  dust_density_floor: 1.0e-22

thermodynamics_parameters:
  model: lociso

deadzone_parameters:
  deadzone_inner_radius_au: 2.7
  deadzone_outer_radius_au: 24.0
  deadzone_inner_transition_width_mult: 1.0
  deadzone_outer_transition_width_mult: 1.0
  deadzone_alpha_reduction: 0.01

dust_parameters:
  initial_dust_to_gas_ratio: 0.1
  population_one_mass_ratio: 1.0
  one_size_particle_value_cm: 1.0
  dust_particle_density_g_cm3: 1.6
  dust_smoothing_mode: cic

boundary_conditions:
  inner_boundary_condition: zero_gradient
  outer_boundary_condition: zero_gradient

time_parameters:
  total_simulation_time: 1000.0
  output_write_frequency: 100.0

output_parameters:
  output_directory_name: output_backreaction
  output_format: ascii

