# Thermal-model test configuration (gas only)

simulation_parameters:
  enable_dust_drift: false
  enable_dust_growth: false
  enable_gas_evolution: true
  enable_two_dust_populations: false
  enable_photoevaporation: false
  enable_selfgravity: false
  omp_num_threads: 6

disk_parameters:
  number_of_grid_points: 500
  radial_grid_type: logarithmic
  inner_radius_au: 0.1
  outer_radius_au: 50.0
  disk_mass: 0.01
  sigma_profile_exponent: -0.5
  alpha_viscosity: 0.003
  star_mass_msun: 1.0
  aspect_ratio_at_1au: 0.05
  flaring_index: 0.0
  density_floor: 1e-20

thermodynamics_parameters:
  model: radiative                   # alternatives: lociso, locally_isotherm
  mean_molecular_weight: 2.34
  background_temperature_k: 10.0
  minimum_temperature_k: 1.0
  maximum_temperature_k: 1500.0

deadzone_parameters:
  deadzone_inner_radius_au: 2.7
  deadzone_outer_radius_au: 24.0
  deadzone_inner_transition_width_mult: 1.0
  deadzone_outer_transition_width_mult: 1.0
  deadzone_alpha_reduction: 0.01

output_parameters:
  input_file_path: ""
  output_directory_name: "output_thermal"
  output_format: "ascii"

time_parameters:
  total_simulation_time: 5e5
  output_write_frequency: 10000
