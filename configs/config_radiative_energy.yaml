# Thermal-model test configuration (gas only)

simulation_parameters:
  enable_dust_drift: false
  enable_dust_growth: false
  enable_gas_evolution: true
  enable_two_dust_populations: false
  enable_photoevaporation: false
  enable_selfgravity: false
  omp_num_threads: 6

disk_parameters:
  number_of_grid_points: 500
#  radial_grid_type: logarithmic
  inner_radius_au: 1.0
  outer_radius_au: 50.0
  disk_mass: 0.01
  sigma_profile_exponent: -0.5
  alpha_viscosity: 0.003
  star_mass_msun: 1.0
  aspect_ratio_at_1au: 0.05
  flaring_index: 0.0
  density_floor: 1e-20

thermodynamics_parameters:
  model: radiative_energy         # alternatives: radiative, lociso, locally_isotherm
  gamma: 1.4
  background_temperature_k: 10.0
  minimum_temperature_k: 1.0
  maximum_temperature_k: 1500.0
  irradiation_luminosity_lsun: 1.0  # omitted/default 0.0: irradiation off
  #irradiation_model: prescribed   # alternative: geometry (chi*H surface + shadowing)
  irradiation_model: geometry   # alternative: geometry (chi*H surface + shadowing)
  #irradiation_factor: 0.05         # effective geometry/absorption factor
  irradiation_surface_height: 4.0     # geometry mode: surface height/H
  irradiation_stellar_radius_rsun: 2.0
  # Caveat: geometry assumes an opaque chi*H surface, even in depleted cells.
  # Thermal tau affects cooling, not stellar-light transmission or shadow opacity.
  # See docs/thermodynamics.md; transparent gaps/cavities require a future model.

deadzone_parameters:
  deadzone_inner_radius_au: 2.7
  deadzone_outer_radius_au: 24.0
  deadzone_inner_transition_width_mult: 1.0
  deadzone_outer_transition_width_mult: 1.0
  deadzone_alpha_reduction: 0.01

boundary_conditions:
  inner_boundary_condition: outflow
  outer_boundary_condition: outflow

output_parameters:
  input_file_path: ""
  output_directory_name: "output_radiative_energy_geometry"
  output_format: "ascii"

time_parameters:
  total_simulation_time: 5e5
  output_write_frequency: 10000
