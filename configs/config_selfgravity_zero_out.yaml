# Self-gravity test configuration (gas only)

simulation_parameters:
  enable_dust_drift: false
  enable_dust_growth: false
  enable_gas_evolution: true
  enable_two_dust_populations: false
  enable_photoevaporation: false
  enable_selfgravity: true            # axisymmetric disk self-gravity in the rotation curve
  omp_num_threads: 6

disk_parameters:
  number_of_grid_points: 500
  inner_radius_au: 1.0
  outer_radius_au: 50.0
  disk_mass: 0.1                    # massive disk, so the self-gravity term is significant
  sigma_profile_exponent: -0.5
  alpha_viscosity: 0.003
  star_mass_msun: 1.0
  aspect_ratio_at_1au: 0.05
  flaring_index: 0.0
  density_floor: 1e-20
  #use_cutoff_for_gas: true
  #characteristic_cutoff_radius_au: 10.0
  #cutoff_sharpness_factor: 1.5

deadzone_parameters:
  deadzone_inner_radius_au: 2.7
  deadzone_outer_radius_au: 24.0
  deadzone_inner_transition_width_mult: 1.0
  deadzone_outer_transition_width_mult: 1.0
  deadzone_alpha_reduction: 0.01

output_parameters:
  input_file_path: ""
  output_directory_name: "output_selfgravity"
  output_format: "ascii"

boundary_conditions:
  inner_boundary_condition: zero_gradient
  outer_boundary_condition: zero_gradient

time_parameters:
  total_simulation_time: 5e5
  output_write_frequency: 10000
