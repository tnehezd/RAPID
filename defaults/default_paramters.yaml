# YAML reference for the current RAPID development binary, not a runnable config.
# Omitted parameters use the binary defaults. Choose either disk_mass or sigma0.
# Two-population dust, self-gravity, backreaction and radiative/energy modes are temporarily unavailable
# and deliberately omitted. The available thermal model is locally isothermal.

simulation_parameters:
  enable_dust_drift: true           # -drift
  enable_dust_growth: true          # -growth
  enable_gas_evolution: true        # -evol
  enable_photoevaporation: false    # -photoevap
  fragmentation_velocity: 1000.0   # -ufrag, cm/s
  fragmentation_factor: 0.37       # -ffrag, dimensionless
  # test_mode: mass_test           # -test; omitted by default

disk_parameters:
  number_of_grid_points: 2000      # -n, physical radial points
  radial_grid_type: linear         # -grid_type: linear or logarithmic
  inner_radius_au: 1.0             # -ri
  outer_radius_au: 100.0           # -ro
  # disk_mass: 0.01                # -disk_mass, M_sun; user-supplied normalization
  # initial_gas_sigma0_msun_per_au2: 3.33e-5 # -sigma0_init, alternative normalization
  sigma_profile_exponent: 0.5      # -index_init, initialized Sigma proportional to r^(-abs(p))
  alpha_viscosity: 0.01            # -alpha_init
  star_mass_msun: 1.0              # -stellar_mass
  aspect_ratio_at_1au: 0.05        # -h_init
  flaring_index: 0.0               # -flind_init
  density_floor: 1.0e-12           # -density_floor, M_sun/AU^2
  dust_density_floor: 1.0e-15      # -dust_density_floor, M_sun/AU^2
  photoevaporation_mode: none      # -photoevap_mode: none, owen or picogna
  xray_luminosity_erg_s: 1.0e30     # -xray_luminosity
  use_cutoff_for_gas: false        # -cutoff
  characteristic_cutoff_radius_au: 30.0 # -cutoff_radius
  cutoff_sharpness_factor: 1.5      # -cutoff_sharpness

deadzone_parameters:
  deadzone_inner_radius_au: 0.0    # -rdzei, AU; zero disables the dead zone
  deadzone_outer_radius_au: 0.0    # -rdzeo, AU
  deadzone_inner_transition_width_mult: 0.0 # -drdzei, actual tanh width in AU
  deadzone_outer_transition_width_mult: 0.0 # -drdzeo, actual tanh width in AU
  # Legacy key names: the wrapper forwards widths directly, without multiplying H.
  deadzone_alpha_reduction: 0.0    # -amod

dust_parameters:
  number_of_dust_particles: 5000   # -ndust
  initial_dust_to_gas_ratio: 0.01   # -eps
  # one_size_particle_value_cm: 0.1 # -largesize; fixed radius, disable growth
  # constant_stokes_number: 0.1    # -stokes; alternative to fixed physical size
  # Constant Stokes: enable drift, disable growth and two populations.
  # No nonzero -largesize, input profile or benchmark mode; omit key to disable.
  dust_particle_density_g_cm3: 1.6 # -pdensity
  dust_smoothing_mode: cic         # -dust_smoothing: cic, ngp, tophat or gaussian
  gaussian_smoothing_sigma_grid_units: 1.0 # -gaussian_sigma_grid_units
  gaussian_smoothing_cutoff_sigma: 3.0     # -gaussian_cutoff_sigma

boundary_conditions:
  inner_boundary_condition: zero_gradient # -inner_bc
  outer_boundary_condition: parabolic     # -outer_bc
  # zero_gradient, parabolic, fixed_flux, absorbing, reflecting,
  # linear_extrapolation or loggrid (gas fields; dust boundaries are absorbing).

output_parameters:
  # input_file_path: profile.dat   # -i; omitted by default
  output_directory_name: output    # -o
  output_format: ascii             # -output_format: ascii or hdf5

time_parameters:
  fixed_time_step: 0.0             # -tStep, internal time units; zero is adaptive
  total_simulation_time: 1000000.0  # -tmax, years
  output_write_frequency: 1000.0   # -outfreq, years

log_parameters:
  info_level: none                 # -v / -vv: none, info or debug
  disable_terminal_panels: false   # -no_panels
