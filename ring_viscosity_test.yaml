# config.yaml - Long-Term Mass Conservation Benchmark

simulation_parameters:
  enable_gas_evolution: true
  test_mode: "ring_viscosity"             # Aktiválja a belső tömegmegmaradási benchmarkot!

disk_parameters:
  number_of_grid_points: 200
  inner_radius_au: 0.5
  outer_radius_au: 25.0
  disk_mass: 0.01                    # Fizikailag reális korongtömeg (M_sun)
  alpha_viscosity: 0.3
  star_mass_msun: 1.0

boundary_conditions:
  inner_boundary_condition: "parabolic" # Nyitott belső perem a viszkózus akkrécióhoz
  outer_boundary_condition: "reflecting" # Sima külső peremfeltétel

output_parameters:
  output_directory_name: "output_ring_viscosity_test"    # Kimeneti könyvtár neve (-o)

time_parameters:
  fixed_time_step: 0.0               # 0.0 = automatikus, dinamikus CFL időlépés-számítás
  total_simulation_time: 2500.0    # 100 000 év
  output_write_frequency: 500.0

log_parameters:
  info_level: "info"                 # "none", "info" (-v), vagy "debug" (-vv)