# config.yaml - Long-Term Mass Conservation Benchmark

simulation_parameters:
  enable_gas_evolution: true
  test_mode: "ring_viscosity"            

disk_parameters:
  number_of_grid_points: 200
  inner_radius_au: 0.5
  outer_radius_au: 25.0
  disk_mass: 0.01                   
  alpha_viscosity: 0.3
  star_mass_msun: 1.0

boundary_conditions:
  inner_boundary_condition: "parabolic" 
  outer_boundary_condition: "reflecting" 

output_parameters:
  output_directory_name: "output_ring_viscosity_test"   

time_parameters:    
  fixed_time_step: 0.0                        
  total_simulation_time: 2500.0    
  output_write_frequency: 500.0

log_parameters:
  info_level: "info"                 # "none", "info" (-v), or "debug" (-vv)