name: Trigger RAPID Documentation

on:
  release:
    types: [published]

jobs:
  trigger-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger RAPID-docs
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.RAPID_DOCS_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tnehezd/RAPID-docs/dispatches \
            -d '{
              "event_type": "rapid-release",
              "client_payload": {
                "rapid_tag": "${{ github.event.release.tag_name }}"
              }
            }'