name: Trigger RAPID Documentation

on:
  workflow_dispatch:
    inputs:
      rapid_tag:
        description: "RAPID release tag"
        required: true

  release:
    types: [published]

jobs:
  trigger-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Set RAPID tag
        id: rapid
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.rapid_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger RAPID-docs
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.RAPID_DOCS_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tnehezd/RAPID-docs/dispatches \
            -d '{
              "event_type": "rapid-release",
              "client_payload": {
                "rapid_tag": "${{ steps.rapid.outputs.tag }}"
              }
            }'