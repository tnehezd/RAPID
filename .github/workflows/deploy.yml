name: Build RAPID

on:
  release:
    types: [published]

jobs:
  build:
    name: Build RAPID on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout RAPID
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft* || true
          sudo apt-get update -y
          sudo apt-get install -y libhdf5-dev libomp-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5 libomp

      - name: Compile C/C++ simulation engine
        run: |
          make clean
          make all

  trigger-rapidsim:
    name: Trigger rapidsim release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger rapidsim
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.RAPIDSIM_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tnehezd/rapidsim/dispatches \
            -d '{
              "event_type": "rapid-release",
              "client_payload": {
                "rapid_tag": "${{ github.event.release.tag_name }}"
              }
            }'