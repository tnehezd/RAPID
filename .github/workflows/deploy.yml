name: Build RAPID

on:
  release:
    types: [published]

jobs:
  build:
    name: Build RAPID on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout RAPID
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft* || true
          sudo apt-get update -y
          sudo apt-get install -y libhdf5-dev libomp-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5 libomp

      - name: Compile C simulation engine
        run: |
          make clean
          make all

      - name: Build Source Distribution (Linux)
        if: runner.os == 'Linux'
        run: python -m build --sdist

      - name: Build Wheel (macOS)
        if: runner.os == 'macOS'
        run: python -m build --wheel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rapid-${{ matrix.os }}
          path: dist/*

  trigger-rapidsim:
    name: Trigger rapidsim release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger rapidsim
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.RAPIDSIM_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tnehezd/rapidsim/dispatches \
            -d '{
              "event_type": "rapid-release",
              "client_payload": {
                "rapid_tag": "${{ github.event.release.tag_name }}"
              }
            }'