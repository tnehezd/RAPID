name: Build and Upload to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
jobs:
  build_wheels:
    name: Build wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # Lefuttatja Linuxon és Macen is paralel!

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # 1. Lokálisan lefordítjuk a C motort az adott operációs rendszeren
      - name: Compile C simulation engine
        run: |
          make clean
          make all

      # 2. Összerakjuk a wheel csomagot, ami már tartalmazza a lefordított binárist
      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheels to artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  pypi-publish:
    name: Upload to PyPI
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: trusted-publishing # Vagy használhatsz API tokent is
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Ide majd beállíthatod a PyPI API tokenedet secrets-ként a GitHubon
          password: ${{ secrets.PYPI_API_TOKEN }}