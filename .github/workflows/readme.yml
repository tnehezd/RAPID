name: Generate README

on:
  workflow_dispatch:
    inputs:
      rapid_tag:
        description: "RAPID release tag"
        required: true

  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-readme:
    name: Generate README
    runs-on: ubuntu-latest

    steps:
      - name: Set RAPID tag
        id: rapid
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.rapid_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout RAPID
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate README
        env:
          RAPID_TAG: ${{ steps.rapid.outputs.tag }}
        shell: bash
        run: |
          RAPID_VERSION="${RAPID_TAG#v}"
          RELEASE_URL="https://github.com/tnehezd/RAPID/releases/tag/${RAPID_TAG}"

          sed \
            -e "s|{{RAPID_VERSION}}|${RAPID_VERSION}|g" \
            -e "s|{{RAPID_TAG}}|${RAPID_TAG}|g" \
            -e "s|{{RELEASE_URL}}|${RELEASE_URL}|g" \
            .github/templates/README.md.tmpl > README.md

      - name: Create README update branch
        id: branch
        env:
          RAPID_TAG: ${{ steps.rapid.outputs.tag }}
        shell: bash
        run: |
          BRANCH="docs/update-readme-${RAPID_TAG}"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"

      - name: Commit generated README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README.md is already up to date."
            exit 0
          fi

          git commit -m "docs: update README for ${{ steps.rapid.outputs.tag }}"

      - name: Push README update branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --force origin "$BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RAPID_TAG: ${{ steps.rapid.outputs.tag }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: update README for ${RAPID_TAG}" \
            --body "Automatically generated README update for RAPID ${RAPID_TAG}."
