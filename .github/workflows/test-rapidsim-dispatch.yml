name: Test rapidsim dispatch

on:
  workflow_dispatch:

jobs:
  test-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger rapidsim test event
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.RAPIDSIM_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tnehezd/rapidsim/dispatches \
            -d '{
              "event_type": "rapid-release-test",
              "client_payload": {
                "rapid_tag": "v2.2.3",
                "previous_rapid_tag": "v2.2.2"
              }
            }'
