# Runtime comparison: one drifting/growing dust population, locally isothermal.
simulation_parameters:
  enable_gas_evolution: true
  enable_photoevaporation: true
  enable_selfgravity: true
  enable_dust_drift: true
  enable_dust_growth: true
  enable_two_dust_populations: false
  number_of_dust_particles: 1000
  omp_num_threads: 4
disk_parameters:
  number_of_grid_points: 500
  radial_grid_type: linear
  inner_radius_au: 1.0
  outer_radius_au: 50.0
  disk_mass: 0.01
  sigma_profile_exponent: -0.5
  alpha_viscosity: 0.003
  star_mass_msun: 1.0
  aspect_ratio_at_1au: 0.05
  flaring_index: 0.0
  density_floor: 1e-20
  dust_density_floor: 1e-22
  photoevaporation_mode: Picogna
  xray_luminosity_erg_s: 1e30
thermodynamics_parameters:
  model: lociso
deadzone_parameters:
  deadzone_inner_radius_au: 2.7
  deadzone_outer_radius_au: 24.0
  deadzone_inner_transition_width_mult: 1.0
  deadzone_outer_transition_width_mult: 1.0
  deadzone_alpha_reduction: 0.01
dust_parameters:
  initial_dust_to_gas_ratio: 0.01
  population_one_mass_ratio: 1.0
  one_size_particle_value_cm: 0.01
  dust_particle_density_g_cm3: 1.6
  dust_smoothing_mode: gaussian
  gaussian_smoothing_sigma_grid_units: 1.0
  gaussian_smoothing_cutoff_sigma: 3.0
boundary_conditions:
  inner_boundary_condition: zero_gradient
  outer_boundary_condition: zero_gradient
output_parameters:
  output_directory_name: output_bench_photoev_sg_dust_lociso
  output_format: ascii
time_parameters:
  total_simulation_time: 5e5
  output_write_frequency: 10000
log_parameters:
  info_level: info
  disable_terminal_panels: true
